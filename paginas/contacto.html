    <section>
        <p>Completa el formulario para escribir.<p>
        <form action="#" method="get">
                <label for="nombre">Nombre</label>
                <input
                    id="nombre"
                    name="nombre"
                    required
                 >

                 <input
                     type="email"
                     id="email"
                     name="email"
                     required
                >

                <label for="mensaje">Mensaje</label>
                <textarea 
                    id="mensaje"
                    name="mensaje"
                    rows="7" 
                >
                </textarea>
            <button type="submit">
                Enviar
            </button>
        </form>
