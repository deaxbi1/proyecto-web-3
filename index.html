            <img src="./assets/cataratas 2.webp" alt="" class="img1">
                <p class="texto1">Las Cataratas del Iguazú son una de las maravillas naturales más impresionantes del mundo. 
                    Se encuentran en la provincia de Misiones, Argentina, en la frontera con Brasil, y están formadas por aproximadamente 275 saltos de agua rodeados de una exuberante selva tropical.</p>
            <img src="./assets/cataratas 2.jpg" alt="" class="img2">
                <p class="texto2">Su salto más famoso es la Garganta del Diablo, que se destaca por su gran altura y la fuerza de sus aguas. Este lugar forma parte del Parque Nacional Iguazú, donde se pueden observar diferentes especies de animales y plantas.

                    Las cataratas fueron declaradas Patrimonio Natural de la Humanidad por la UNESCO y son uno de los principales atractivos turísticos de Argentina. Su belleza, biodiversidad y paisajes las convierten en un destino único para visitantes de todo el mundo.</p>
